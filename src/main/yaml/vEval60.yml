incarnation: scafi

variables:
  random: &random
    min: 0
    max: 15
    step: 1
    default: 2
  range: &range
    formula: 350
  leader: &leader
    formula: 24
  fail_probability: &fail_probability
    type: ArbitraryVariable
    parameters: [ 0.0, [ 0.0, 0.1, 0.2, 0.4, 0.7 ] ]
  kill_percentage: &kill_percentage
    type: ArbitraryVariable
    parameters: [ 0.0, [ 0.0, 0.1, 0.2, 0.3 ] ]

  perception_error: &perception_error
    type: ArbitraryVariable
    parameters: [ 0.0, [ 0.0, 1.0, 5.0, 10.0 ] ]

  send: &send
    formula: >
      "send;" + fail_probability
    language: scala

_constants:
  grain: &grain 500.0
  retentionTime: &retentionTime 5.0

environment:
  type: Continuous2DEnvironment
  parameters: []
  global-programs:
    - time-distribution:
        type: Trigger
        parameters: [ 2000 ]
      type: RandomlyKillAgents
      parameters: [ *kill_percentage ]

seeds:
  scenario: *random
  simulation: *random

network-model:
  type: ConnectWithinDistance
  parameters: [*range]

_reactions:
  - program: &program
    - time-distribution: 1
      type: Event
      actions:
        - type: RunScafiProgram
          parameters: [it.unibo.scafi.evaluation.VPatternFormation, *retentionTime, *perception_error]
    - program: *send
  - move: &move
    - time-distribution:
        type: DiracComb
        parameters: [ 0, 1 ]
      type: Event
      actions: { type: MoveToTargetWithSpeed, parameters: [ destination, speed ] }

deployments:
  type: Grid
  parameters: [0, 0, 1000, 1000, 150, 150, 25, 25]
  programs:
  - *program
  - *move
  contents:
  - molecule: grain
    concentration: *grain
  - molecule: angleFactor
    concentration: 1.5
  - molecule: leader
    concentration: *leader
  - molecule: speed
    concentration: 1.0
  - molecule: lead
    concentration: false
export:
  - type: PositionExporter
    parameters: [ "data/positions", "vEval60", 5 ]
    data: []
  - type: CSVExporter
    parameters:
      exportPath: "data"
      fileNameRoot: "vEval60"
      interval: 1.0
    data:
      - time
      - type: AngleExtractor
        parameters: [ *leader ]
      - type: CorrectPositionExtractor
        parameters: [ ]

terminate:
  - type: AfterTime
    parameters: 4000
